name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"   # ambil data terbaru dari Google Sheet tiap 6 jam
  workflow_dispatch:         # tombol "Run workflow" untuk update manual

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site from Google Sheet data
        run: node scripts/build.mjs
        env:
          DATA_URL: ${{ vars.DATA_URL }}
          SITE_URL: https://kbbivoices.github.io
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
